on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  schedule:
    # Rebuild daily at 8 AM UTC (4 AM Eastern) for fresh data
    - cron: '0 8 * * *'

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux Library Dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y --fix-missing libudunits2-dev libgdal-dev libgeos-dev libproj-dev libfontconfig1-dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render and Publish
        run: quarto publish gh-pages --id adammwilson/TrailPulse --no-browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
