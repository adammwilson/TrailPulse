on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  schedule:
    # Fixed to EST (UTC−5), not EDT. During EDT these fire 7:00 AM / 2:00 PM local.
    # 6:00 AM EST → 11:00 UTC
    - cron: '0 11 * * *'
    # 1:00 PM EST → 18:00 UTC
    - cron: '0 18 * * *'

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux Library Dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y --fix-missing libudunits2-dev libgdal-dev libgeos-dev libproj-dev libfontconfig1-dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Restore weather data cache
        uses: actions/cache@v4
        with:
          path: |
            parks/hunters-creek/data/cache
            parks/sprague-brook/data/cache
          key: park-cache-${{ github.run_id }}
          restore-keys: |
            park-cache-

      - name: Pre-fetch weather data for all parks
        run: Rscript scripts/prefetch_all_parks.R

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
