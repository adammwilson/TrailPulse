on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # Fixed to EST (UTC−5), not EDT. During EDT these fire 7:00 AM / 2:00 PM local.
    # 6:00 AM EST → 11:00 UTC
    - cron: '0 11 * * *'
    # 1:00 PM EST → 18:00 UTC
    - cron: '0 18 * * *'

name: Quarto Publish

jobs:
  build-deploy:
    # Pin away from ubuntu-latest (26.04/resolute as of ~2026-10-31): GCC 15
    # breaks s2 1.1.9's vendored Abseil (`uintptr_t` / missing <cstdint>).
    # 24.04 matches the last green Quarto Publish runs.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux Library Dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev \
            libfontconfig1-dev libglpk40 libglpk-dev \
            libssl-dev libabsl-dev cmake pkg-config

      - name: Configure R Makevars for Abseil/GCC
        run: |-
          mkdir -p "$HOME/.R"
          # Ensure ~/.R/Makevars exists (avoids readRenviron warning) and force
          # <cstdint> into CXX compiles so vendored Abseil builds if needed.
          cat > "$HOME/.R/Makevars" <<'EOF'
          CXXFLAGS += -include cstdint
          CXX11FLAGS += -include cstdint
          CXX14FLAGS += -include cstdint
          CXX17FLAGS += -include cstdint
          EOF

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 3

      - name: Restore weather data cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            parks/hunters-creek/data/cache
            parks/sprague-brook/data/cache
            data/cache/brms
          key: park-cache-${{ github.run_id }}
          restore-keys: |
            park-cache-

      - name: Pre-fetch weather data for all parks
        if: github.event_name != 'pull_request'
        run: Rscript scripts/prefetch_all_parks.R

      - name: Render and Publish
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
