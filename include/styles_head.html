<style>
/* ── TrailPulse custom styles ── */
/* Source of truth for site CSS (_quarto.yml include-in-header).
   Keep include/styles.css in sync when editing. */

/* ── Hero section ── */
.tp-hero {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}

.tp-hero .tp-face {
  flex-shrink: 0;
}

.tp-hero-text h2 {
  margin-top: 0;
  font-size: 2rem;
}

/* ── Mud/snow level badge ── */
.tp-level-badge {
  display: inline-block;
  padding: 0.35em 0.9em;
  border-radius: 2em;
  font-weight: 700;
  font-size: 1.1em;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #fff;
}

/* Mud level colors */
.mud-0  { background: #d4a96a; } /* Bone Dry   */
.mud-1  { background: #c9a060; } /* Dusty      */
.mud-2  { background: #b8864a; } /* Firm       */
.mud-3  { background: #a06c34; } /* Tacky      */
.mud-4  { background: #8b5a2b; } /* Soft       */
.mud-5  { background: #7a4a22; } /* Muddy      */
.mud-6  { background: #6b3b18; } /* Very Muddy */
.mud-7  { background: #5a2e10; } /* Impassable */

/* Snow level colors */
.snow-0 { background: #b0bec5; } /* Bare       */
.snow-1 { background: #90a4ae; } /* Dusting    */
.snow-2 { background: #64b5f6; } /* Skiable    */
.snow-3 { background: #1e88e5; } /* Good       */
.snow-4 { background: #0d47a1; } /* Powder Day */

/* ── 7-day mini face strip ── */
.tp-forecast-strip {
  display: flex;
  gap: 0.5rem;
  justify-content: space-around;
  flex-wrap: wrap;
  margin: 1rem 0;
}

.tp-forecast-strip--scroll {
  flex-wrap: nowrap;
  justify-content: flex-start;
  width: max-content;
  min-width: 100%;
  margin: 0;
}

.tp-forecast-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 0.75rem;
  gap: 0.25rem;
  flex-shrink: 0;
}

.tp-forecast-day .day-label {
  font-weight: 600;
  color: var(--bs-secondary);
}

.tp-forecast-day .mud-label {
  font-size: 0.65rem;
  color: var(--bs-secondary);
}

/* Horizontal scroll wrapper for NWS / forecast strips */
.tp-hscroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 1rem 0;
  padding-bottom: 0.25rem;
}

/* ── Stat badges ── */
.tp-stat-row {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin-top: 0.5rem;
}

.tp-stat-box {
  background: var(--bs-light);
  border-radius: 0.5rem;
  padding: 1rem 1.25rem;
  text-align: center;
  flex: 1 1 140px;
  min-width: 120px;
}

.tp-stat-box .stat-value {
  font-size: 2rem;
  font-weight: 700;
  line-height: 1;
}

.tp-stat-box .stat-label {
  font-size: 0.8rem;
  color: var(--bs-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ── Percentile badge ── */
.tp-percentile {
  background: var(--bs-primary);
  color: white;
  border-radius: 0.5rem;
  padding: 0.75rem 1.25rem;
  display: inline-block;
  font-size: 1rem;
}

/* ── Forecast boundary line in dygraphs ── */
.dygraph-annotation-container > div {
  border-left: 2px dashed #666 !important;
}

/* ── Park cards on landing page ── */
.tp-park-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
  gap: 1.25rem;
  margin-top: 1.5rem;
}

.tp-park-card {
  border: 1px solid var(--bs-border-color);
  border-radius: 0.75rem;
  padding: 1.25rem;
  text-decoration: none;
  color: inherit;
  display: block;
  transition: box-shadow 0.2s;
}

.tp-park-card:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  text-decoration: none;
  color: inherit;
}

.tp-park-card .park-name {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 0.25rem;
}

.tp-park-card .park-location {
  font-size: 0.85rem;
  color: var(--bs-secondary);
  margin-bottom: 0.75rem;
}

/* ── NWS forecast cards ── */
.nws-forecast-card {
  min-width: 80px;
  max-width: 100px;
  border: 1px solid var(--bs-border-color);
  border-radius: 0.5rem;
  padding: 0.4rem 0.3rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.15rem;
  font-size: 0.75rem;
  flex-shrink: 0;
}
.nws-forecast-card .nws-period-name {
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--bs-body-color);
}
.nws-forecast-card .nws-temp {
  font-size: 0.85rem;
  font-weight: 500;
  line-height: 1.2;
}
.nws-forecast-card .nws-precip { color: #1565C0; font-size: 0.75rem; }
.nws-forecast-card .nws-wind   { color: var(--bs-secondary); font-size: 0.7rem; }
.nws-forecast-card .nws-desc {
  font-size: 0.65rem;
  color: var(--bs-secondary);
  max-width: 90px;
  overflow-wrap: break-word;
}
.nws-forecast-card img { width: 48px; height: 48px; border-radius: 4px; }

/* ── Condition card (hero redesign) ── */
.tp-condition-card {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.tp-condition-main {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.tp-condition-main > svg {
  width: 160px;
  max-width: 100%;
  height: auto;
  flex-shrink: 0;
}

/* Short-window score graph (replaces mudface/snowface in heroes) */
.tp-short-window {
  display: block;
  width: 100%;
  max-width: 720px;
  height: auto;
  margin: 0.15rem 0 0.35rem;
  border-radius: 8px;
  border: 1px solid rgba(0, 0, 0, 0.08);
  background: #fff;
}

.tp-score-col {
  flex: 1;
  min-width: 200px;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.tp-score-header {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.tp-score-num {
  font-size: 3rem;
  font-weight: 800;
  line-height: 1;
}

.tp-label-pill {
  display: inline-block;
  padding: 0.25em 0.8em;
  border-radius: 999px;
  font-weight: 700;
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #fff;
}

.tp-score-bar-bg {
  height: 12px;
  min-height: 12px;
  width: 100%;
  border-radius: 6px;
  background: #dee2e6;
  overflow: hidden;
  flex-shrink: 0;
}

.tp-score-bar-fill {
  height: 12px;
  border-radius: 6px;
  transition: width 0.3s ease;
}

.tp-score-endpoints {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--bs-secondary);
}

/* Condition context row */
.tp-context-row {
  font-size: 0.9rem;
  color: var(--bs-secondary);
}

/* ── Page toolbar: update banner + share ── */
.tp-page-toolbar {
  display: flex;
  align-items: stretch;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.tp-page-toolbar .tp-update-banner {
  flex: 1 1 16rem;
  margin-bottom: 0;
}

.tp-share-btn {
  flex: 0 0 auto;
  align-self: center;
  appearance: none;
  border: 1px solid var(--bs-border-color, #ced4da);
  background: var(--bs-body-bg, #fff);
  color: var(--bs-body-color, #212529);
  border-radius: 0.4rem;
  padding: 0.55rem 0.95rem;
  font-size: 0.875rem;
  font-weight: 600;
  line-height: 1.2;
  cursor: pointer;
  min-height: 44px;
  touch-action: manipulation;
}

.tp-share-btn:hover,
.tp-share-btn:focus-visible {
  border-color: var(--bs-primary, #0d6efd);
  color: var(--bs-primary, #0d6efd);
  outline: none;
}

.tp-share-btn:focus-visible {
  box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
}

.tp-share-btn.tp-share-copied {
  border-color: #16a34a;
  color: #15803d;
  background: #dcfce7;
}

/* ── Last-updated banner ── */
.tp-update-banner {
  padding: 0.45rem 0.85rem;
  border-left: 4px solid #0d6efd;
  background: #f0f6ff;
  border-radius: 0 0.25rem 0.25rem 0;
  margin-bottom: 1rem;
  font-size: 0.875rem;
}

.tp-update-banner.tp-stale {
  border-left-color: #dc3545;
  background: #fff5f5;
  color: #842029;
}

.tp-update-banner.tp-stale::before {
  content: "⚠️ Data may be outdated — ";
  font-weight: 700;
}

/* Charts / figures — never overflow viewport */
.cell-output-display,
.quarto-figure,
.figure {
  max-width: 100%;
  overflow-x: auto;
}

.cell-output-display img,
.quarto-figure img,
img.figure-img,
.plotly {
  max-width: 100%;
  height: auto;
}

svg.ggplot,
.cell-output-display svg {
  max-width: 100%;
  height: auto;
}

/* Dark mode overrides */
[data-bs-theme="dark"] .tp-score-bar-bg { background: #495057; }
[data-bs-theme="dark"] .tp-update-banner { background: #1a2840; border-left-color: #4d9fff; }
[data-bs-theme="dark"] .tp-update-banner.tp-stale { background: #3b1219; border-left-color: #f87171; color: #fca5a5; }
[data-bs-theme="dark"] .tp-stat-box { background: var(--bs-secondary-bg, #343a40); }
[data-bs-theme="dark"] .tp-share-btn {
  background: var(--bs-secondary-bg, #343a40);
  border-color: #6c757d;
  color: var(--bs-body-color, #dee2e6);
}
[data-bs-theme="dark"] .tp-share-btn.tp-share-copied {
  background: #14532d;
  border-color: #22c55e;
  color: #86efac;
}

/* ── Phone ── */
@media (max-width: 576px) {
  .tp-condition-main {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.75rem;
  }

  .tp-condition-main > svg {
    width: 88px;
    max-width: 88px;
  }

  .tp-score-col {
    min-width: 0;
    width: 100%;
  }

  .tp-score-num {
    font-size: 2rem;
  }

  .tp-label-pill {
    font-size: 0.85rem;
  }

  .tp-stat-box {
    flex: 1 1 calc(50% - 0.5rem);
    padding: 0.75rem 0.85rem;
  }

  .tp-stat-box .stat-value {
    font-size: 1.35rem;
  }

  .tp-stat-box .stat-label {
    font-size: 0.7rem;
  }

  .tp-percentile {
    display: block;
    width: 100%;
    box-sizing: border-box;
  }

  .tp-forecast-day svg {
    width: 56px !important;
    height: auto !important;
  }

  .tp-page-toolbar {
    flex-direction: column;
    align-items: stretch;
  }

  .tp-share-btn {
    width: 100%;
  }

  .tp-hero-text h2 {
    font-size: 1.5rem;
  }
}

/* ── Tablet ── */
@media (min-width: 577px) and (max-width: 992px) {
  .tp-score-num {
    font-size: 2.5rem;
  }

  .tp-condition-main > svg {
    width: 130px;
  }
}
</style>
