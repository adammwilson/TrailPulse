parks:
  - id: hunters-creek
    name: Hunters Creek Park
    short_name: Hunters Creek
    location: Elma, NY
    lat: 42.750580
    lon: -78.539871
    timezone: America/New_York
    usgs_gauge: "04214500"
    usgs_gauge_name: Buffalo River near Elma NY
    weather_history_start: "2000-01-01"
    activities:
      - hiking
      - mountain_biking
      - trail_running
      - nordic_skiing
      - snowshoeing
    description: >
      1,000 acres of hardwood forest in Elma, NY with 18 miles of multi-use
      trails popular for hiking, mountain biking, and winter Nordic skiing.
    trail_data: data/hunters-creek/trails
    # Mud model calibration: adjust sigmoid midpoint and steepness for local soils
    mud_calibration:
      midpoint: 0.35   # soil wetness fraction at which mud level = 5
      steepness: 12    # higher = sharper transition
      precip_boost: 1.0 # added mud levels if >5mm precip in last 24h
    # Snow season definition
    snow_season:
      start_month: 11
      start_day: 1
      end_month: 4
      end_day: 30
