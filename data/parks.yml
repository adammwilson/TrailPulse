parks:
  - id: hunters-creek
    name: Hunters Creek Park
    short_name: Hunters Creek
    location: Wales, NY
    lat: 42.750580
    lon: -78.539871
    timezone: America/New_York
    usgs_gauge: "04214500"
    usgs_gauge_name: Buffalo River near Elma NY
    weather_history_start: "2000-01-01"
    activities:
      - hiking
      - mountain_biking
      - trail_running
      - nordic_skiing
      - snowshoeing
    description: >
      1,000 acres of hardwood forest in Wales, NY with 18 miles of multi-use
      trails popular for hiking, mountain biking, and winter Nordic skiing.
    trail_data: data/hunters-creek/trails
    # Mud model calibration: clay soils — reactive, retains water, sharp wet/dry transition
    mud_calibration:
      midpoint: 0.28    # clay becomes soft/muddy at lower soil-wetness fraction than loam
      steepness: 15     # sharper transition — clay goes from rideable to unrideable quickly
      precip_boost: 1.5 # clay surface saturates fast; added mud levels if >5mm in last 24h
    # Snow season definition
    snow_season:
      start_month: 11
      start_day: 1
      end_month: 4
      end_day: 30

  - id: sprague-brook
    name: Sprague Brook Park
    short_name: Sprague Brook
    location: Glenwood, NY
    lat: 42.5340
    lon: -78.5300
    timezone: America/New_York
    usgs_gauge: ~                     # no daily-value gauge on Sprague Brook
    usgs_gauge_name: ~
    weather_history_start: "2000-01-01"
    activities:
      - hiking
      - mountain_biking
      - trail_running
      - nordic_skiing
      - snowshoeing
    description: >
      1,200 acres of mixed hardwood forest in Glenwood, NY with over 20 miles
      of multi-use trails popular for hiking, mountain biking, and winter skiing.
    # Mud model calibration: clay soils similar to Hunters Creek
    mud_calibration:
      midpoint: 0.28
      steepness: 15
      precip_boost: 1.5
    snow_season:
      start_month: 11
      start_day: 1
      end_month: 4
      end_day: 30
