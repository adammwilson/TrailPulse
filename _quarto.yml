project:
  type: website
  output-dir: _site
  resources:
    - img/

execute:
  freeze: auto

website:
  google-analytics: "G-FHSPP71LBP"   # replace with your Measurement ID
  title: "TrailPulse"
  description: "Live mud scores, snow conditions, and 7-day forecasts for local trails. Know before you go."
  favicon: img/favicon.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    logo: img/logo.png
    logo-alt: "TrailPulse"
    left:
      - href: index.qmd
        text: Parks
      - text: Parks
        menu:
          - href: parks/hunters-creek/index.qmd
            text: "Hunters Creek Park"
          - href: parks/sprague-brook/index.qmd
            text: "Sprague Brook Park"
    right:
      - icon: github
        href: https://github.com/adammwilson/TrailPulse
  page-footer:
    left: "Trail conditions data updated daily. Not a substitute for official trail status."
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: false
    include-in-header: include/styles_head.html
    include-after-body: include/after_body.html
